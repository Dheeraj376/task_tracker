<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login | Task Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111827; font-family: Arial, sans-serif; color: #111827; }
        .card { width: min(100%, 400px); padding: 32px; background: white; border-radius: 10px; }
        h1 { margin: 0 0 8px; }
        p { color: #6b7280; }
        label { display: block; margin: 18px 0 7px; font-size: 13px; font-weight: 700; }
        input { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
        button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 6px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
        .error { color: #b91c1c; font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Admin login</h1>
        <p>Sign in to manage users and tasks.</p>
        {% for message in messages %}<div class="error">{{ message }}</div>{% endfor %}
        <form method="post">
            {% csrf_token %}
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
