<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Task Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #eef2ff;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }
        .signup-card {
            width: min(100%, 460px);
            padding: 36px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 18px 45px rgba(30, 41, 59, 0.12);
        }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .subtitle { margin: 0 0 28px; color: #6b7280; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 700; }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font: inherit;
        }
        input:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
        .error { margin: 0 0 16px; color: #b91c1c; font-size: 13px; }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .login-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            font-size: 14px;
            text-decoration: none;
        }
        .login-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="signup-card">
        <h1>Create your account</h1>
        <p class="subtitle">Enter your details to use Task Tracker.</p>

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required value="{{ request.POST.username|default:'' }}">
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.POST.email|default:'' }}">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
            </div>

            <div class="field">
                <label for="password2">Confirm password</label>
                <input id="password2" name="password2" type="password" autocomplete="new-password" required>
            </div>

            <button type="submit">Sign up</button>
        </form>

        <a class="login-link" href="{% url 'login' %}">Already have an account? Sign in</a>
    </main>
</body>
</html>
